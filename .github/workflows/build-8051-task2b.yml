name: Build 8051 CAT2 TASK2B HEX

on:
  push:
    branches: [main]
    paths:
      - '8051/CAT2/TASK2B/main.c'
      - '8051/CAT2/TASK2B/delay.c'
      - '8051/CAT2/TASK2B/delay.h'
      - '8051/CAT2/TASK2B/TASK2B.uvproj'
      - '.github/workflows/build-8051-task2b.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SDCC 8051 compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y sdcc

      - name: Compile Intel HEX firmware
        shell: bash
        run: |
          set -euo pipefail
          TASK_DIR="$GITHUB_WORKSPACE/8051/CAT2/TASK2B"
          BUILD_DIR="$(mktemp -d)"
          cp "$TASK_DIR/main.c" "$TASK_DIR/delay.c" "$TASK_DIR/delay.h" "$BUILD_DIR/"
          cd "$BUILD_DIR"
          sdcc -mmcs51 --model-small --opt-code-size -o TASK2B.ihx main.c delay.c
          test -s TASK2B.ihx
          packihx TASK2B.ihx > "$TASK_DIR/Objects/TASK2B.hex"
          test -s "$TASK_DIR/Objects/TASK2B.hex"
          grep -q '^:00000001FF' "$TASK_DIR/Objects/TASK2B.hex"

      - name: Commit generated HEX
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 8051/CAT2/TASK2B/Objects/TASK2B.hex
          if git diff --cached --quiet; then
            echo "HEX output is already up to date."
            exit 0
          fi
          git commit -m "Build CAT2 TASK2B 8051 HEX firmware"
          git push
