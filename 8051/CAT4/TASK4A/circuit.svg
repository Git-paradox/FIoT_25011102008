<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="100%" height="100%" fill="#f8fafc"/><rect x="28" y="24" width="1344" height="100" rx="18" fill="#0f172a"/><text x="65" y="66" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">TASK4A — 4×4 keypad, LEDs and seven-segment display</text><text x="65" y="98" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Circuit / wiring connection diagram • verify module pin labels before powering</text><rect x="55" y="150" width="445" height="185" rx="15" fill="#fff" stroke="#2563eb" stroke-width="3"/><rect x="55" y="150" width="445" height="42" rx="13" fill="#2563eb"/><text x="78" y="178" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">4×4 matrix keypad</text><text x="78" y="217" fill="#1e293b" font-family="Arial,sans-serif" font-size="16">R1–R4 → P1.0–P1.3</text><text x="78" y="242" fill="#1e293b" font-family="Arial,sans-serif" font-size="16">C1–C4 → P1.4–P1.7</text><text x="78" y="267" fill="#1e293b" font-family="Arial,sans-serif" font-size="16">Use module row/column labels</text><path d="M500 242.5 H835 Q860 242.5 880 242.5" fill="none" stroke="#2563eb" stroke-width="4"/><circle cx="880" cy="242.5" r="6" fill="#2563eb"/><rect x="55" y="353" width="445" height="185" rx="15" fill="#fff" stroke="#0f766e" stroke-width="3"/><rect x="55" y="353" width="445" height="42" rx="13" fill="#0f766e"/><text x="78" y="381" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Common-cathode 7-segment</text><text x="78" y="420" fill="#1e293b" font-family="Arial,sans-serif" font-size="16">Segments a,b,c,d,e,f,g,dp → P2.0–P2.7</text><text x="78" y="445" fill="#1e293b" font-family="Arial,sans-serif" font-size="16">One 330 Ω resistor per segment</text><text x="78" y="470" fill="#1e293b" font-family="Arial,sans-serif" font-size="16">Common cathode pin(s) → GND</text><path d="M500 445.5 H835 Q860 445.5 880 445.5" fill="none" stroke="#0f766e" stroke-width="4"/><circle cx="880" cy="445.5" r="6" fill="#0f766e"/><rect x="55" y="556" width="445" height="185" rx="15" fill="#fff" stroke="#b45309" stroke-width="3"/><rect x="55" y="556" width="445" height="42" rx="13" fill="#b45309"/><text x="78" y="584" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Four indicator LEDs</text><text x="78" y="623" fill="#1e293b" font-family="Arial,sans-serif" font-size="16">Each LED with 330 Ω resistor</text><text x="78" y="648" fill="#1e293b" font-family="Arial,sans-serif" font-size="16">+5 V → resistor → LED anode</text><text x="78" y="673" fill="#1e293b" font-family="Arial,sans-serif" font-size="16">LED cathodes → P3.4–P3.7</text><path d="M500 648.5 H835 Q860 648.5 880 648.5" fill="none" stroke="#b45309" stroke-width="4"/><circle cx="880" cy="648.5" r="6" fill="#b45309"/><rect x="880" y="165" width="455" height="590" rx="22" fill="#e0f2fe" stroke="#0369a1" stroke-width="4"/><rect x="880" y="165" width="455" height="76" rx="18" fill="#075985"/><text x="908" y="199" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">AT89S52 (5 V)</text><text x="908" y="225" fill="#dbeafe" font-family="Arial,sans-serif" font-size="15">Controller / development board</text><text x="908" y="277" fill="#0f172a" font-family="Arial,sans-serif" font-size="18">P1.0–P1.3 — keypad rows R1–R4</text><text x="908" y="308" fill="#0f172a" font-family="Arial,sans-serif" font-size="18">P1.4–P1.7 — keypad columns C1–C4</text><text x="908" y="339" fill="#0f172a" font-family="Arial,sans-serif" font-size="18">P2.0–P2.7 — seven-segment a–g, dp</text><text x="908" y="370" fill="#0f172a" font-family="Arial,sans-serif" font-size="18">P3.4–P3.7 — four active-low LEDs</text><text x="908" y="401" fill="#0f172a" font-family="Arial,sans-serif" font-size="18">+5 V supply; 11.0592 MHz crystal</text><rect x="55" y="790" width="1280" height="78" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="80" y="821" fill="#9a3412" font-family="Arial,sans-serif" font-size="17" font-weight="700">NOTES</text><text x="170" y="821" fill="#7c2d12" font-family="Arial,sans-serif" font-size="16">The display is common-cathode; use one current-limiting resistor per segment.</text><text x="170" y="848" fill="#7c2d12" font-family="Arial,sans-serif" font-size="16">Check the exact keypad row/column order and seven-segment pinout for your modules.</text></svg>