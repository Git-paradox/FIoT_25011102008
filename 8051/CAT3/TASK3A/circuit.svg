<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="100%" height="100%" fill="#f8fafc"/><rect x="28" y="24" width="1344" height="100" rx="18" fill="#0f172a"/><text x="65" y="66" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">TASK3A — Timer LED patterns + button interrupt</text><text x="65" y="98" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Circuit / wiring connection diagram • verify module pin labels before powering</text><rect x="55" y="150" width="445" height="185" rx="15" fill="#fff" stroke="#2563eb" stroke-width="3"/><rect x="55" y="150" width="445" height="42" rx="13" fill="#2563eb"/><text x="78" y="178" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Four LEDs</text><text x="78" y="217" fill="#1e293b" font-family="Arial,sans-serif" font-size="16">Each LED has its own 330 Ω resistor</text><text x="78" y="242" fill="#1e293b" font-family="Arial,sans-serif" font-size="16">+5 V → resistor → LED anode</text><text x="78" y="267" fill="#1e293b" font-family="Arial,sans-serif" font-size="16">LED cathodes → P1.0, P1.1, P1.2, P1.3</text><path d="M500 242.5 H835 Q860 242.5 880 242.5" fill="none" stroke="#2563eb" stroke-width="4"/><circle cx="880" cy="242.5" r="6" fill="#2563eb"/><rect x="55" y="353" width="445" height="185" rx="15" fill="#fff" stroke="#0f766e" stroke-width="3"/><rect x="55" y="353" width="445" height="42" rx="13" fill="#0f766e"/><text x="78" y="381" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Mode push-button</text><text x="78" y="420" fill="#1e293b" font-family="Arial,sans-serif" font-size="16">One side → P3.2 / INT0</text><text x="78" y="445" fill="#1e293b" font-family="Arial,sans-serif" font-size="16">Other side → GND when pressed</text><text x="78" y="470" fill="#1e293b" font-family="Arial,sans-serif" font-size="16">Port 3 internal pull-up; active-low</text><path d="M500 445.5 H835 Q860 445.5 880 445.5" fill="none" stroke="#0f766e" stroke-width="4"/><circle cx="880" cy="445.5" r="6" fill="#0f766e"/><rect x="880" y="165" width="455" height="590" rx="22" fill="#e0f2fe" stroke="#0369a1" stroke-width="4"/><rect x="880" y="165" width="455" height="76" rx="18" fill="#075985"/><text x="908" y="199" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">AT89S52 (5 V)</text><text x="908" y="225" fill="#dbeafe" font-family="Arial,sans-serif" font-size="15">Controller / development board</text><text x="908" y="277" fill="#0f172a" font-family="Arial,sans-serif" font-size="18">P1.0–P1.3 — four active-low LED outputs</text><text x="908" y="308" fill="#0f172a" font-family="Arial,sans-serif" font-size="18">P3.2 / INT0 — push-button input</text><text x="908" y="339" fill="#0f172a" font-family="Arial,sans-serif" font-size="18">11.0592 MHz crystal; +5 V supply</text><rect x="55" y="790" width="1280" height="78" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="80" y="821" fill="#9a3412" font-family="Arial,sans-serif" font-size="17" font-weight="700">NOTES</text><text x="170" y="821" fill="#7c2d12" font-family="Arial,sans-serif" font-size="16">Each LED is independently current-limited; all grounds are common.</text><text x="170" y="848" fill="#7c2d12" font-family="Arial,sans-serif" font-size="16">The button is active-low and uses the Port 3 internal pull-up.</text></svg>